[build-system]
requires = ["setuptools>=84.0.0", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "figma-to-pyside6"
version = "0.1.0"
description = "Figma to PySide6 workbench and converter"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.12.0",
]

[project.optional-dependencies]
dev = [
  "black>=26.10.1",
  "mypy>=2.4.0",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pytest-qt>=4.5.0",
  "ruff>=0.17.0",
]
build = [
  "pyinstaller>=6.22.3",
]

[project.scripts]
figma-to-pyside6 = "figma_to_pyside6.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
figma_to_pyside6 = ["assets/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "/examples/"  # generated output, regenerated by the converter

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["examples"]  # generated output, regenerated by the converter

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "D", "C4", "RUF", "PIE", "RET", "T20"]
allowed-confusables = ["×", "·"]  # used on purpose in the frame list rows

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "N802"]  # N802: fakes mirror Qt camelCase API
"scripts/**" = ["T20"]
"src/figma_to_pyside6/__main__.py" = ["T20"]  # CLI output is the product

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src/figma_to_pyside6"]
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[tool.coverage.run]
source = ["figma_to_pyside6"]
branch = true

[tool.coverage.report]
show_missing = true
