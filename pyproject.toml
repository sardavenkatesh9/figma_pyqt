[build-system]
requires = ["setuptools>=84.0.0", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "figma-to-pyside6"
version = "0.1.0"
description = "Figma to PySide6 workbench and converter"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.12.0",
]

[project.optional-dependencies]
dev = [
  "black>=26.10.1",
  "mypy>=2.4.0",
  "pytest>=9.1.1",
  "pytest-qt>=4.5.0",
  "ruff>=0.17.0",
]
build = [
  "pyinstaller>=6.22.3",
]

[project.scripts]
figma-to-pyside6 = "figma_to_pyside6.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src/figma_to_pyside6"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
show_error_codes = true
