# Install once with `pip install pre-commit && pre-commit install`.
# Local hooks use the tools from `pip install -e ".[dev]"`, so versions match CI exactly.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: python -m ruff check --fix
        language: system
        types: [python]
      - id: black
        name: black
        entry: python -m black
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: python -m mypy
        language: system
        types: [python]
        pass_filenames: false
        files: ^src/
